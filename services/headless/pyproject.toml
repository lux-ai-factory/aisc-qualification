[project]
name = "aisc-qualification-headless"
version = "0.1.0"
description = "Headless qualification compute service: indexes a questionnaire definition and answers, returns the AI card."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.32,<1",
]

[tool.uv]
# A service, not a library: nothing to package or install as a project
# (app.py runs in place, next to service_token.py).
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]
