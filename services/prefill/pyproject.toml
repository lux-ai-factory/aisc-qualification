[project]
name = "aisc-qualification-prefill"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pypdf>=6.19",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# uv runs pytest as a console script, which does not add the service dir to
# sys.path the way `python -m pytest` does; the tests import `app` and `prefill`.
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8",
]
