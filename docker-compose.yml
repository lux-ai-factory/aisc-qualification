services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: qualification
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d qualification"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LiteLLM completion service. Holds the provider key (e.g. ANTHROPIC_API_KEY);
  # the app calls it over HTTP — no provider SDK/key in the Next.js app.
  llm:
    build: ./services/llm
    restart: unless-stopped
    environment:
      # Default provider is Mistral; LiteLLM picks the key matching LLM_MODEL.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-mistral/mistral-large-latest}
    ports:
      - "4000:4000"

  # System-card PDF renderer (Jinja + WeasyPrint).
  system-card-renderer:
    build: ./services/system_card_renderer
    restart: unless-stopped
    ports:
      - "8005:8005"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/qualification?schema=public
      LLM_SERVICE_URL: http://llm:4000
      SYSTEM_CARD_RENDERER_URL: http://system-card-renderer:8005
    ports:
      - "3000:3000"
