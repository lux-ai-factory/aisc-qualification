# Compose fragment for apps/qualification, to merge with the platform infra
# (which provides the shared Postgres `postgres` on the `backend` network):
#   docker compose --env-file env.development \
#     -f docker-compose-infra.development.yml \
#     -f apps/qualification/docker-compose.development.yml up -d qualification-web
#
# The AISC stack itself defines these services in the aisc repo's
# docker-compose.development.yml; this file does not include the
# qualification-migrate, qualification-agents and qualification-prefill services.
#
# Platform-side prerequisites:
#   - The project databases, which the platform creates. The web container does
#     not change any schema on start; scripts/migrate-projects.mjs migrates them.
#   - A provider key (e.g. ANTHROPIC_API_KEY) for the qualification-llm service,
#     from the platform env or a secret, never committed here.
#   - A Caddy route: /qualification* -> qualification-web:3000.
#
# Build contexts are relative to the platform project root, with this repo
# mounted at apps/qualification.

services:
  # LiteLLM completion sidecar: it holds the provider key, and the app calls it over HTTP.
  qualification-llm:
    build: apps/qualification/services/llm
    container_name: qualification-llm
    environment:
      # The default provider is Mistral; LiteLLM uses the key matching LLM_MODEL.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${QUALIFICATION_LLM_MODEL:-mistral/mistral-large-latest}
    restart: unless-stopped
    networks: [backend]

  # System-card PDF renderer sidecar.
  qualification-pdf:
    build: apps/qualification/services/system_card_renderer
    container_name: qualification-pdf
    restart: unless-stopped
    networks: [backend]

  # AIRO ontology service: qualification -> filled AIRO 3.1 graph + card view.
  qualification-ontology:
    build:
      context: apps/qualification
      dockerfile: services/ontology/Dockerfile
    container_name: qualification-ontology
    restart: unless-stopped
    networks: [backend]

  qualification-web:
    build:
      context: apps/qualification
      args:
        # Set QUALIFICATION_BASE_PATH=/qualification for subpath routing behind Caddy.
        NEXT_BASE_PATH: ${QUALIFICATION_BASE_PATH:-}
    container_name: qualification-web
    env_file: apps/qualification/env.development
    depends_on:
      - postgres
      - qualification-llm
      - qualification-pdf
      - qualification-ontology
    ports:
      # Optional direct access, not needed behind Caddy. 3200 avoids the
      # platform webapp (3000) and controls (3100).
      - "${QUALIFICATION_WEB_PORT:-3200}:3000"
    restart: unless-stopped
    networks: [backend, frontend]

networks:
  backend:
  frontend:
